
name: 'gridpulse'
version: '1.0.0'

profile: 'gridpulse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


models:
  gridpulse:
    # Metabase reads column help text from Postgres comments, so without this every
    # warning written in the yml stops at the repo and never reaches the dashboard
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    marts:
      +materialized: table
      +post-hook: "analyze {{ this }}"
