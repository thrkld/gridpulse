version: 2

models:
  - name: stg_neso
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ingested_at
              - start_time
    columns:
      - name: ingested_at
        description: "datetime (UTC) of original ingestion from source."
        data_tests:
          - dbt_utils.at_least_one
          - not_null

      - name: start_time
        description: "datetime (UTC) of start of half hour period, derived from local SETTLEMENT_DATE and SETTLEMENT_PERIOD (convert-first: London local to UTC, then add half hours)."
        data_tests:
          - not_null

      - name: end_time
        description: "datetime (UTC) of end of half hour period."
        data_tests:
          - not_null

      - name: settlement_date
        description: "date (UTC) of settlement period."
        data_tests:
          - not_null

      - name: settlement_period
        description: "numbered settlement period within a day (1 - 48) where period 1 is 00:00 - 00:30 (UTC)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48

      - name: forecast_actual_indicator
        description: "'A' if the row is settled actual demand, 'F' if still forecast. Flips F to A as the period settles. NULL on rows from the historic yearly resources, which carry no indicator column and are always settled, so downstream comparisons must treat NULL as settled (is distinct from 'F')."
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'F']

      - name: national_demand
        description: "National Demand (MW): demand met by major metered generation, excluding pumped-storage pumping and interconnector exports."
        data_tests:
          - not_null

      - name: transmission_system_demand
        description: "Transmission System Demand (MW): ND plus pumped-storage pumping, station load, and interconnector exports."
        data_tests:
          - not_null

      - name: england_wales_demand
        description: "Demand (MW) for England and Wales only."
        data_tests:
          - not_null

      - name: embedded_wind_generation
        description: "Estimated output (MW) of distribution-connected (embedded) wind, not seen by the transmission system. NESO estimate."
        data_tests:
          - not_null

      - name: embedded_solar_generation
        description: "Estimated output (MW) of embedded solar. NESO estimate. ~0 overnight."
        data_tests:
          - not_null

      - name: ifa_flow
        description: "Interconnector flow (MW), IFA (GB-France, nuclear). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: ifa2_flow
        description: "Interconnector flow (MW), IFA2 (GB-France, nuclear). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: eleclink_flow
        description: "Interconnector flow (MW), ElecLink (GB-France via Channel Tunnel). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: nsl_flow
        description: "Interconnector flow (MW), North Sea Link (GB-Norway, hydro). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: viking_flow
        description: "Interconnector flow (MW), Viking Link (GB-Denmark, wind-heavy). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: britned_flow
        description: "Interconnector flow (MW), BritNed (GB-Netherlands). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: nemo_flow
        description: "Interconnector flow (MW), Nemo Link (GB-Belgium). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: moyle_flow
        description: "Interconnector flow (MW), Moyle (GB-Northern Ireland). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: east_west_flow
        description: "Interconnector flow (MW), East-West (GB-Ireland). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: greenlink_flow
        description: "Interconnector flow (MW), Greenlink (GB-Ireland via Wales). Positive = import, negative = export."
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: scottish_transfer
        description: "Transfer (MW) across the Scotland-England boundary. Internal to GB, NOT a cross-border interconnector - exclude from import sums in Q5."
        data_tests:
          - not_null:
              config:
                severity: warn
