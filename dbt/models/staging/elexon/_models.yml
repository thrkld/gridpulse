version: 2

models:
  - name: stg_elexon_imbalance
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ingested_at
              - start_time
    columns:
      - name: ingested_at
        description: "datetime (UTC) of original ingestion from endpoint."
        data_tests:
          - dbt_utils.at_least_one
          - not_null
  
      - name: start_time
        description: "datetime (UTC) of start of half hour period in which data was read."
        data_tests:
          - not_null

      - name: created_datetime
        description: "The timestamp when the record was generated/published."
        data_tests:
          - not_null
      
      - name: settlement_date
        description: "date (UTC) of settlement period."
        data_tests:
          - not_null
        
      - name: settlement_period
        description: "numbered settlement period within a day (1 - 48) where period 1 is 00:00 - 00:30 (UTC)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48

      - name: system_buy_price
        description: "The price (£/MWh) paid by participants who were short (consumed more electricity than contracted)."
        data_tests:
          - not_null

      - name: system_sell_price
        description: "The price (£/MWh) received by participants who were long (generated or consumed less than contracted)."
        data_tests:
          - not_null

      - name: net_imbalance_volume
        description: "The overall net imbalance (MWh) of the electricity system during this settlement period."
        data_tests:
          - not_null


  - name: stg_elexon_market_index
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ingested_at
              - start_time
              - data_provider
      # N2EX rows are all zeros by design; an APX row of zeros would mean parsing broke
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (price = 0 and volume = 0)"
          config:
            severity: warn
            where: "data_provider = 'APXMIDP'"
    
    columns:
      - name: ingested_at
        description: "datetime (UTC) of original ingestion from endpoint."
        data_tests:
          - dbt_utils.at_least_one
          - not_null
  
      - name: start_time
        description: "datetime (UTC) of start of half hour period in which data was read."
        data_tests:
          - not_null
      
      # settlement date and period not necessary for UTC settlement_period derivation in this case i.e not critical
      - name: settlement_date
        description: "date (UTC) of settlement period."
        data_tests:
          - not_null
        
      - name: settlement_period
        description: "numbered settlement period within a day (1 - 48) where period 1 is 00:00 - 00:30 (UTC)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48

      # NOTE: N2EXMIDP results in 0.0 price and volume
      - name: data_provider
        description: "Identifiers for source of data: Nord Pool UK (N2EX) and APX Electricity Exchange (APX)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['N2EXMIDP','APXMIDP']


      - name: price
        description: "The market price (£/MWh) for the period."
        data_tests:
          - not_null

      - name: volume
        description: "The total traded volume (MWh) used to calculate the price."
        data_tests:
          - not_null


  - name: stg_elexon_demand_forecast
    data_tests:
      # A single response repeats some records verbatim (same period, same
      # publication, same value), so this is the source's habit rather than a
      # parsing fault. Marts dedup on (start_time, publish_time) regardless.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ingested_at
              - start_time
              - publish_time
          config:
            severity: warn

    columns:
      - name: ingested_at
        description: "datetime (UTC) of original ingestion from endpoint."
        data_tests:
          - dbt_utils.at_least_one
          - not_null

      - name: start_time
        description: "datetime (UTC) of start of half hour period being forecast."
        data_tests:
          - not_null

      # a period is forecast repeatedly, so publish_time is part of the grain
      - name: publish_time
        description: "datetime (UTC) the forecast was published by Elexon."
        data_tests:
          - not_null

      - name: forecast_lead
        description: "interval between publication and the period starting. Negative once the period has begun."

      - name: settlement_date
        description: "date (UTC) of settlement period."
        data_tests:
          - not_null

      - name: settlement_period
        description: "numbered settlement period within a day (1 - 48) where period 1 is 00:00 - 00:30 (UTC)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48

      # only the national boundary is published on this dataset
      - name: boundary
        description: "Transmission boundary the forecast applies to. A second boundary appearing would collide the (start_time, publish_time) grain downstream, so the accepted_values warn is a tripwire."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['N']
              config:
                severity: warn

      - name: national_demand_forecast
        description: "forecast national demand (MW) for the half hour."
        data_tests:
          - not_null


  - name: stg_elexon_demand_outturn
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ingested_at
              - start_time

    columns:
      - name: ingested_at
        description: "datetime (UTC) of original ingestion from endpoint."
        data_tests:
          - dbt_utils.at_least_one
          - not_null

      - name: start_time
        description: "datetime (UTC) of start of half hour period in which demand was measured."
        data_tests:
          - not_null

      - name: publish_time
        description: "datetime (UTC) the outturn was published by Elexon."
        data_tests:
          - not_null

      - name: settlement_date
        description: "date (UTC) of settlement period."
        data_tests:
          - not_null

      - name: settlement_period
        description: "numbered settlement period within a day (1 - 48) where period 1 is 00:00 - 00:30 (UTC)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48

      - name: national_demand
        description: "initial national demand outturn (INDO) in MW, settled."
        data_tests:
          - not_null

      # the newest period can carry a demand figure before its transmission one
      - name: transmission_system_demand
        description: "initial transmission system demand outturn (ITSDO) in MW, settled. Briefly null on the most recent period, before Elexon publishes it."
        data_tests:
          - not_null:
              config:
                severity: warn
