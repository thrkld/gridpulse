name: ci
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # >3.11 for datetime.UTC
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest
      - run: ruff format --check .
      - run: ruff check .