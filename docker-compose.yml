services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gridpulse
      POSTGRES_USER: gridpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
  metabase:
    # Keep the dashboard API version consistent across installs.
    image: metabase/metabase:v0.62.3.6
    ports:
      # Leave port 3000 available for Dagster.
      - "3002:3000"
    volumes:
      # Persist accounts, questions and dashboards across container replacements.
      - metabase-data:/metabase.db
    depends_on:
      - postgres

volumes:
  pgdata:
  metabase-data:
